name: Fix SSH Access

on:
  workflow_dispatch:

jobs:
  fix-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "${{ secrets.SERVER_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Add deploy public key
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PUBLIC_KEY: ${{ secrets.DEPLOY_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          test -n "$DEPLOY_PUBLIC_KEY"

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -i ~/.ssh/deploy_key \
            "$SERVER_USER@$SERVER_HOST" \
            "DEPLOY_PUBLIC_KEY='$DEPLOY_PUBLIC_KEY' bash -s" << 'EOF'

          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          touch ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys

          grep -qxF "$DEPLOY_PUBLIC_KEY" ~/.ssh/authorized_keys || \
            printf '%s\n' "$DEPLOY_PUBLIC_KEY" >> ~/.ssh/authorized_keys

          chmod 600 ~/.ssh/authorized_keys

          echo "SSH deploy key installed successfully"

          EOF
