# fly.toml app configuration file generated for job-alert-dnzwuw on 2026-05-11T21:37:57Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'job-alert-dnzwuw'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[processes]
  app = 'python main.py'

[[mounts]]
  source = 'bot_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
