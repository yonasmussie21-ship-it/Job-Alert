app = 'job-alert-dnzwuw'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[processes]
  app = 'python main.py'

[[mounts]]
  source = 'bot_data'
  destination = '/data'
  processes = ['app']

[restart]
  policy = "always"

[deploy]
  strategy = "rolling"

[scale]
  count = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
  swap_size_mb = 512
