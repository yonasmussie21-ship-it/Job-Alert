# fly.toml app configuration file generated for job-alert on 2026-05-08T23:14:02Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "job-alert"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[http_service]
  internal_port = 8080
  force_https = false
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[processes]
  app = "python bot.py"
