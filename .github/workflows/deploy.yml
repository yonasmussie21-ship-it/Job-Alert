name: Deploy to Oracle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.ORACLE_IP }}" >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.ORACLE_IP }} << EOF
            set -e

            APP_DIR="\$HOME/Job-Alert-main"

            if [ ! -d "\$APP_DIR/.git" ]; then
              git clone https://github.com/yonasmussie21-ship-it/Job-Alert.git "\$APP_DIR"
            fi

            cd "\$APP_DIR"
            git pull origin main

            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            echo "Restarting service..."
            sudo systemctl restart amazon-bot

            echo "Checking status..."
            sudo systemctl status amazon-bot --no-pager

          EOF
``
