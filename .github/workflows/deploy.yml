- name: Deploy to server
  run: |
    ssh -i ~/.ssh/id_rsa \
      -o StrictHostKeyChecking=no \
      ubuntu@${{ secrets.ORACLE_IP }} << 'EOF'

      set -euxo pipefail

      mkdir -p ~/.ssh

      echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGdgtmbnwR38Bqd8IFzqImTAGq4yMDUaDoBQCUWB5MHO github-deploy" >> ~/.ssh/authorized_keys

      chmod 700 ~/.ssh
      chmod 600 ~/.ssh/authorized_keys

      echo "✅ SSH repaired"

      if [ ! -d "$HOME/Job-Alert-main/.git" ]; then
        git clone https://github.com/yonasmussie21-ship-it/Job-Alert.git "$HOME/Job-Alert-main"
      fi

      cd "$HOME/Job-Alert-main"

      git pull origin main

      if [ ! -d "venv" ]; then
        python3 -m venv venv
      fi

      source venv/bin/activate

      pip install --upgrade pip
      pip install -r requirements.txt

      sudo systemctl restart amazon-bot || true

    EOF
