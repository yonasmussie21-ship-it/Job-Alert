name: Deploy Production

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "${{ secrets.SERVER_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy production
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -i ~/.ssh/deploy_key \
            "$SERVER_USER@$SERVER_HOST" \
            "GITHUB_SHA='$GITHUB_SHA' bash -s" << 'EOF'

          set -euo pipefail

          APP_BASE="/opt/amazon-bot"
          RELEASES="$APP_BASE/releases"
          CURRENT="$APP_BASE/current"
          SHARED="$APP_BASE/shared"
          LOCK="$APP_BASE/deploy.lock"
          LOG="$APP_BASE/deploy.log"

          REPO="https://github.com/yonasmussie21-ship-it/Job-Alert.git"
          SERVICE="amazon-bot"
          HEALTH_URL="http://127.0.0.1:8000/health"

          RELEASE_ID="$(date +%Y%m%d_%H%M%S)_${GITHUB_SHA:0:7}"
          DIR="$RELEASES/$RELEASE_ID"
          PREV=""

          log() {
            echo "[$(date '+%F %T')] [$RELEASE_ID] $*" | tee -a "$LOG"
          }

          diagnostics() {
            sudo systemctl status "$SERVICE" --no-pager || true
            sudo journalctl -u "$SERVICE" -n 120 --no-pager || true
            df -h || true
            free -m || true
          }

          verify() {
            if ! sudo systemctl is-active --quiet "$SERVICE"; then
              log "systemd reports service NOT active"
              return 1
            fi

            if command -v curl >/dev/null 2>&1; then
              for i in 1 2 3 4 5; do
                if curl -fsS --max-time 10 "$HEALTH_URL" >/dev/null; then
                  log "Health check passed"
                  return 0
                fi

                log "Health check attempt $i failed"
                sleep 3
              done

              log "Health endpoint check FAILED: $HEALTH_URL"
              return 1
            else
              log "curl not installed; skipped HTTP health check"
            fi

            return 0
          }

          rollback() {
            log "ROLLBACK START"

            if [ -n "$PREV" ] && [ -d "$PREV" ]; then
              ln -sfn "$PREV" "$APP_BASE/current_tmp"
              mv -Tf "$APP_BASE/current_tmp" "$CURRENT"

              sudo systemctl restart "$SERVICE" || true
              sleep 5

              if verify; then
                log "ROLLBACK SUCCESS: $PREV"
              else
                log "ROLLBACK FAILED VERIFICATION"
                diagnostics
              fi
            else
              log "No previous release available for rollback"
              diagnostics
            fi

            exit 1
          }

          trap rollback ERR

          mkdir -p "$APP_BASE" "$RELEASES" "$SHARED"

          exec 9>"$LOCK"
          flock -n 9 || {
            log "Deploy already running"
            exit 1
          }

          if [ -L "$CURRENT" ]; then
            PREV="$(readlink -f "$CURRENT")"
            log "Previous release: $PREV"
          fi

          log "Deploying commit: $GITHUB_SHA"

          mkdir -p "$DIR"
          cd "$DIR"

          git init
          git remote add origin "$REPO"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout --detach "$GITHUB_SHA"

          if [ ! -f requirements.txt ]; then
            log "requirements.txt missing"
            exit 1
          fi

          if [ -f "$SHARED/.env" ]; then
            ln -sfn "$SHARED/.env" .env
            log "Linked shared .env"
          else
            log "WARNING: shared .env missing"
          fi

          python3 -m venv venv
          ./venv/bin/python -m pip install --upgrade pip
          ./venv/bin/pip install --no-cache-dir -r requirements.txt

          log "Running compile check"
          ./venv/bin/python -m compileall . >/dev/null

          log "Switching release"
          ln -sfn "$DIR" "$APP_BASE/current_tmp"
          mv -Tf "$APP_BASE/current_tmp" "$CURRENT"

          sudo systemctl daemon-reload
          sudo systemctl restart "$SERVICE"

          sleep 5

          verify || {
            log "Health failed after deploy"
            exit 1
          }

          log "Cleaning old releases"
          CUR="$(readlink -f "$CURRENT")"

          find "$RELEASES" -mindepth 1 -maxdepth 1 -type d \
            ! -path "$CUR" \
            ! -path "$PREV" \
            | sort -r \
            | tail -n +6 \
            | xargs -r rm -rf

          trap - ERR

          log "SUCCESS: deployed $RELEASE_ID"

          EOF
